  const r = await fetch(CONFIG.supabaseUrl.replace(/\/+$/,"") + "/rest/v1/" + path, Object.assign({}, opts, {headers: sbHeaders(opts.headers)}));
  if (!r.ok){ let b={}; try{ b = await r.json(); }catch(e){} const err = new Error(b.message || ("HTTP "+r.status)); err.status=r.status; err.code=b.code; throw err; }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const rpc = (fn, args) => sb("rpc/"+fn, {method:"POST", body: JSON.stringify(args)});
const api = {
  async loadAll(){
    if (mode==="web"){
      const rows = await sb("entries?select=slug,data");
      const next = {}; (rows||[]).forEach(r=>{ if (r.data && r.data.name) next[r.slug] = r.data; });
      entries = next;
      const rr = await sb("results?id=eq.1&select=data");
      results = rr && rr[0] ? rr[0].data : null;
    }
  },
  async saveEntry(slug, doc){
    if (mode==="web"){
      if (isAdmin && locked()) return rpc("admin_save_entry", {p_key:adminKey, p_slug:slug, p_name:doc.name, p_data:doc});
      return sb("entries?on_conflict=slug", {method:"POST", headers:{"Prefer":"resolution=merge-duplicates,return=minimal"}, body: JSON.stringify({slug, name:doc.name, data:doc, updated_at:new Date().toISOString()})});
    }
    if (mode==="claude") return cdb.collection("entries").doc(slug).set(doc);
    throw new Error("nowhere to save");
  },
  async deleteEntry(slug){
    if (mode==="web") return rpc("admin_delete_entry", {p_key:adminKey, p_slug:slug});
    if (mode==="claude") return cdb.collection("entries").doc(slug).delete();
  },
  async saveResults(R){
    if (mode==="web") return rpc("admin_save_results", {p_key:adminKey, p_data:R});
    if (mode==="claude") return cdb.doc("meta/results").set(R);
  }
};

// ===================== standings & bracket =====================
function seeds(conf, wins){ return ABBRS.filter(a=>TEAM[a].c===conf).sort((x,y)=> (wins[y]-wins[x]) || TEAM[x].n.localeCompare(TEAM[y].n)); }
function bracketModel(e){
  if (!e.wins) return null;
  const B = e.bracket || {}, out = {};
  for (const c of ["E","W"]){
    const s = seeds(c, e.wins), b = B[c] || {r1:[],r2:[]}, m = {};
    const seedOf = a => s.indexOf(a)+1;
    m.pa = {cap:"7 vs 8 · winner is the 7 seed", t:[s[6],s[7]], s:[7,8]};
    m.pb = {cap:"9 vs 10 · loser is out", t:[s[8],s[9]], s:[9,10]};
    const loserA = b.pa ? (b.pa===s[6]?s[7]:s[6]) : null;
    m.pc = {cap:"Last game · winner is the 8 seed", t:[loserA, b.pb||null], s:[loserA?seedOf(loserA):"", b.pb?seedOf(b.pb):""]};
    const s7 = b.pa||null, s8 = b.pc||null;
    const sd = a => !a ? "" : a===s7 ? 7 : a===s8 ? 8 : seedOf(a);
    m.r1 = [{t:[s[0],s8],s:[1,8]},{t:[s[3],s[4]],s:[4,5]},{t:[s[2],s[5]],s:[3,6]},{t:[s[1],s7],s:[2,7]}];
    const r1 = b.r1||[], r2 = b.r2||[];
    m.r2 = [{t:[r1[0]||null,r1[1]||null]},{t:[r1[2]||null,r1[3]||null]}]; m.r2.forEach(x=>x.s=x.t.map(sd));
    m.cf = {t:[r2[0]||null,r2[1]||null]}; m.cf.s = m.cf.t.map(sd);
    m.sd = sd; m.seeds = s; out[c] = m;
  }
  out.F = {t:[(B.E||{}).cf||null,(B.W||{}).cf||null]};
  out.F.s = [out.E.sd(out.F.t[0]), out.W.sd(out.F.t[1])];
  return out;
}
function sanitize(e){
  if (!e.wins) return;
  e.bracket = e.bracket || {};
  for (const c of ["E","W"]) { e.bracket[c] = e.bracket[c] || {}; e.bracket[c].r1 = e.bracket[c].r1||[]; e.bracket[c].r2 = e.bracket[c].r2||[]; }
  const ok = (p, mu) => p && mu.t.includes(p) ? p : null;
  for (let i=0;i<3;i++){
    const M = bracketModel(e);
    for (const c of ["E","W"]){
      const b = e.bracket[c], m = M[c];
      b.pa = ok(b.pa, m.pa); b.pb = ok(b.pb, m.pb); b.pc = ok(b.pc, m.pc);
      for (let j=0;j<4;j++) b.r1[j] = ok(b.r1[j], m.r1[j]);
      for (let j=0;j<2;j++) b.r2[j] = ok(b.r2[j], m.r2[j]);
      b.cf = ok(b.cf, m.cf);
    }
    e.bracket.finals = ok(e.bracket.finals, M.F);
  }
  const f = e.bracket.finals;
  if (f) { const M = bracketModel(e); e.picks.champ = f; e.picks.runnerup = M.F.t.find(x=>x!==f)||""; }
}

function combo(id, list, val, dis, attrs){
  return `<div class="combo"><input type="text" id="${id}" ${attrs||""} data-list="${list}" value="${esc(val)}" placeholder="Type or tap to pick" autocomplete="off" autocorrect="off" spellcheck="false" ${dis?"disabled":""}><div class="sugg" hidden></div></div>`;
}
function showSugg(inp){
  const box = inp.parentElement.querySelector(".sugg"), q = fold(inp.value.trim());
  const src = L[inp.dataset.list] || [];
  let hits = !q ? src.slice(0,8) : src.filter(n=>fold(n).includes(q)).sort((a,b)=>{
    const sa = fold(a).split(/\s+/).some(w=>w.startsWith(q)) ? 0 : 1, sb2 = fold(b).split(/\s+/).some(w=>w.startsWith(q)) ? 0 : 1; return sa - sb2; }).slice(0,8);
  if (hits.length===1 && fold(hits[0])===q) hits = [];
  box.innerHTML = hits.map(n=>`<button type="button" data-fill="${esc(n)}">${esc(n)}</button>`).join("");
  box.hidden = !hits.length;
}
function hideSugg(){ document.querySelectorAll(".sugg").forEach(b=>b.hidden=true); }
function coachSelect(id, val, dis, attrs, valueIsTeam){
  return `<select id="${id}" ${attrs||""} ${dis?"disabled":""}><option value="">Pick a coach</option>${BY_NAME.map(a=>{ const v = valueIsTeam ? a : TEAM[a].coach; return `<option value="${esc(v)}" ${val===v?"selected":""}>${esc(TEAM[a].n)} · ${esc(TEAM[a].coach)}</option>`; }).join("")}</select>`;
}
function teamSelect(id, val, dis, attrs){

function ouSelect(id, val, dis, attrs){

function renderLock(){
  const el = document.getElementById("lockline");
  if (locked()) { el.innerHTML = `<span class="pill closed">Locked</span> Picks closed Fri Oct 23, 11:59 PM ET`; return; }

function confBracket(c, M, dis){
  const m = M[c], b = me.bracket[c], name = c==="E"?"East":"West";

    <div class="group"><h3>${name} first round</h3><div class="matchups">${m.r1.map((x,i)=>mu(x.t,x.s,b.r1[i],c,"r1",i,"",dis)).join("")}</div></div>
    <div class="group"><h3>${name} semifinals</h3><div class="matchups">${m.r2.map((x,i)=>mu(x.t,x.s,b.r2[i],c,"r2",i,"",dis)).join("")}</div></div>
    <div class="group"><h3>${name} finals</h3><div class="matchups">${mu(m.cf.t,m.cf.s,b.cf,c,"cf",-1,"",dis)}</div></div>`;
}
function mu(t, s, pick, c, key, idx, cap, dis){
  const btn = (a, sd) => a
    ? `<button data-br="${c}|${key}|${idx}|${a}" class="${pick===a?"win":pick?"lose":""}" ${dis?"disabled":""}><span class="sd">${sd||""}</span>${dot(a)}<span>${esc(teamName(a))}</span></button>`
    : `<div class="tbd">Waiting on an earlier pick</div>`;
  return `<div class="mu">${cap?`<div class="cap">${esc(cap)}</div>`:""}${btn(t[0],s[0])}${btn(t[1],s[1])}</div>`;
}

  if (k==="fired") return TEAM[p.fired] ? `${TEAM[p.fired].coach} (${nick(p.fired)})` : "";
  if (["champ","runnerup","bust","surprise","tank"].includes(k)) return teamName(p[k]);

      <div class="group"><h3>Standings</h3><div class="confs">${["E","W"].map(c=>`<div class="sheet" style="overflow-x:auto"><table class="box"><thead><tr><th>#</th><th>${c==="E"?"East":"West"}</th><th>W-L</th></tr></thead><tbody>${M[c].seeds.map((a,i)=>`<tr class="${i===5?"cut":i===9?"cut2":""}"><td>${i+1}</td><td class="tm"><span>${dot(a)}${esc(nick(a))}</span></td><td>${rec(e.wins[a])}</td></tr>`).join("")}</tbody></table></div>`).join("")}</div></div>`;
  }
  if (isAdmin) html += `<div class="group"><h3>Commissioner</h3><button class="btn danger" data-del="${esc(slug)}">Delete this entry</button></div>`;
  document.getElementById("modalroot").innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(e.name)}'s picks">
    <div class="mh"><div class="in"><h2>${esc(e.name)}</h2></div></div>
    <div class="mb"><div class="in" style="display:flex;flex-direction:column;gap:18px;padding-block:8px">${html}</div></div>
    <div class="mf"><div class="in"><button class="btn primary" data-act="close">Close</button></div></div></div>`;
  document.body.style.overflow = "hidden";
}

// ===================== Results & scoring =====================
const norm = s => fold(s).replace(/\(.*?\)/g,"").replace(/[^a-z ]/g," ").replace(/\s+(jr|sr|ii|iii|iv)\s*$/,"").trim().replace(/\s+/g," ");
function nameEq(a,b){ a=norm(a); b=norm(b); if(!a||!b) return false; if(a===b) return true; const la=a.split(" ").pop(), lb=b.split(" ").pop(); return la.length>2 && la===lb && a[0]===b[0]; }
function derived(R){
  const w = R && R.wins; if (!w || !ABBRS.every(a=>typeof w[a]==="number")) return {};
  const diff = a => w[a]-TEAM[a].ou;
  const minD = Math.min(...ABBRS.map(diff)), maxD = Math.max(...ABBRS.map(diff)), minW = Math.min(...ABBRS.map(a=>w[a]));
  return { bust: ABBRS.filter(a=>diff(a)===minD), surprise: ABBRS.filter(a=>diff(a)===maxD), tank: ABBRS.filter(a=>w[a]===minW) };
}
function score(e, R){
  let c=0, t=0; const p = e.picks||{}, A = R.awards||{}, D = derived(R);
  for (const a of AWARDS) if (A[a.k]) { t++; if (nameEq(p[a.k], A[a.k])) c++; }
  for (const k of ["champ","runnerup","fired"]) if (R[k]) { t++; if (p[k]===R[k]) c++; }
  for (const k of ["bust","surprise","tank"]) if (D[k]) { t++; if (D[k].includes(p[k])) c++; }
  if (R.hiPlayer) { t++; if (nameEq(p.hiPlayer, R.hiPlayer)) c++; }
  const b = e.bracket||{};
  const rnd = (key, arr) => { if (!arr || !arr.length) return; for (const cf of ["E","W"]) { const picks = key==="cf" ? [(b[cf]||{}).cf] : ((b[cf]||{})[key]||[]); picks.forEach(x=>{ if(x){ t++; if(arr.includes(x)) c++; } }); } };
  if (e.wins) { rnd("r1", R.r1); rnd("r2", R.r2); rnd("cf", R.cf); }
  let dev = null;
  if (e.wins && R.wins) { const have = ABBRS.filter(a=>typeof R.wins[a]==="number"); if (have.length) dev = have.reduce((s,a)=>s+Math.abs(e.wins[a]-R.wins[a]),0)/have.length; }
  return {c,t,pct: t? c/t : 0, dev};
}
function renderResults(){
  const v = document.getElementById("v-results"), R = results, list = Object.values(entries);
  let html = "";
  if (R && list.length){
    const sc = list.map(e=>Object.assign({n:e.name}, score(e,R)));
    const pick = sc.filter(x=>x.t).sort((a,b)=>b.pct-a.pct || b.c-a.c);
    const st = sc.filter(x=>x.dev!=null).sort((a,b)=>a.dev-b.dev);
    html += `<div class="group"><h2>Best Picker</h2><p class="note">Share of picks correct (awards, Finals, side bets, bracket rounds), counted as results come in.</p>
      <div class="sheet">${pick.length?pick.map((x,i)=>`<div class="lb"><span class="rk">${i+1}</span><span>${esc(x.n)}</span><span><b>${Math.round(x.pct*100)}%</b> <span class="muted">${x.c}/${x.t}</span></span></div>`).join(""):`<div class="lb"><span></span><span class="muted">No results entered yet</span><span></span></div>`}</div></div>
      <div class="group"><h2>Best Standings</h2><p class="note">Average miss in wins across all 30 teams. Lowest wins. Bonus-round players only.</p>
      <div class="sheet">${st.length?st.map((x,i)=>`<div class="lb"><span class="rk">${i+1}</span><span>${esc(x.n)}</span><span><b>${x.dev.toFixed(1)}</b> <span class="muted">wins off</span></span></div>`).join(""):`<div class="lb"><span></span><span class="muted">Waiting on final records</span><span></span></div>`}</div></div>`;
  } else {
    html += `<div class="group"><h2>Results</h2><div class="notice">Scores show up here as the season plays out, once the commissioner enters what happened.</div>
      <p class="note">Best Picker = % of picks correct. Best Standings = average miss in wins across all 30 teams.</p></div>`;
  }
  if (isAdmin) html += adminForm(R||{});
  else if (mode==="web") html += `<div class="group" style="margin-top:24px"><h3>Commissioner</h3><div class="who"><input type="password" id="adminkey" placeholder="Commissioner password" autocomplete="current-password"><button class="btn" data-act="adminlogin">Log in</button></div></div>`;
  v.innerHTML = html;
}
function adminForm(R){
  const A = R.awards||{}, w = R.wins||{};
  const chk = (key, n) => `<div class="chk">${BY_NAME.map(a=>`<label><input type="checkbox" data-rr="${key}" value="${a}" ${(R[key]||[]).includes(a)?"checked":""}>${a}</label>`).join("")}</div><p class="note" style="padding:0 14px 10px">Check the ${n} teams.</p>`;
  return `<div class="group"><h2>Commissioner</h2><p class="note">Only you see this. Fill in results as they happen and leave anything undecided blank. Disappointment, surprise and tank commander score themselves once all 30 final records are in.</p>
    <div class="sheet"><div class="awr">${AWARDS.map(a=>`<label for="ra-${a.k}">${a.l}${a.coach ? coachSelect("ra-"+a.k, A[a.k]) : combo("ra-"+a.k, a.list, A[a.k], false)}</label>`).join("")}</div></div>
    <div class="sheet">
      <div class="row"><label for="rr-champ">Champion</label>${teamSelect("rr-champ", R.champ)}</div>
      <div class="row"><label for="rr-runnerup">Runner-up</label>${teamSelect("rr-runnerup", R.runnerup)}</div>
      <div class="row"><label for="rr-fired">First coach fired</label>${coachSelect("rr-fired", R.fired, false, "", true)}</div>
      <div class="row"><label for="rr-hiPlayer">Highest-scoring game</label><div class="split">${combo("rr-hiPlayer","all",R.hiPlayer,false)}<input type="number" id="rr-hiPts" value="${esc(R.hiPts)}" placeholder="Pts"></div></div>
    </div>
    <h3>Won first round</h3><div class="sheet">${chk("r1",8)}</div>
    <h3>Won conference semis</h3><div class="sheet">${chk("r2",4)}</div>
    <h3>Won conference finals</h3><div class="sheet">${chk("cf",2)}</div>
    <h3>Final regular-season wins</h3><div class="sheet"><div class="awr">${BY_NAME.map(a=>`<label>${esc(TEAM[a].n)}<input type="number" inputmode="numeric" id="rw-${a}" value="${typeof w[a]==="number"?w[a]:""}" min="0" max="82"></label>`).join("")}</div></div>
    <button class="btn primary block" data-act="saveresults">Save results</button>
    ${mode==="web"?`<button class="btn" data-act="adminlogout">Log out of commissioner</button>`:""}
  </div>`;
}

// ===================== save bar & render =====================
function renderSaveBar(){
  const bar = document.getElementById("savebar"), st = document.getElementById("savestatus"), b = document.getElementById("savebtn");
  const show = tab==="picks" && me.name && canEdit() && mode!=="none";
  bar.hidden = !show; if (!show) return;
  b.disabled = !dirty;
  st.textContent = dirty ? "Unsaved changes" : (entries[slugify(me.name)] ? "All changes saved" : "Not saved yet");
}
function renderAllViews(){
  renderLock();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  for (const t of ["picks","all","results"]) document.getElementById("v-"+t).hidden = t!==tab;
  ({picks:renderPicks, all:renderAll, results:renderResults})[tab]();
  renderSaveBar();
}
function softRefresh(){
  // Called when shared data changes. Don't wipe a form someone is typing into.
  const ae = document.activeElement, typing = ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName);
  if (document.querySelector(".modal")) { renderSaveBar(); return; }
  if (tab==="picks" && me.name) { renderSaveBar(); return; }
  if (tab==="results" && isAdmin) return;
  if (typing && tab==="picks") return;
  renderAllViews();
}
let toastT;
function toast(msg){ let el=document.querySelector(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true, 3000); }

// ===================== actions =====================
function setName(){
  const inp = document.getElementById("nameinput"); const name = (inp.value||"").trim().replace(/\s+/g," ");
  if (!slugify(name)) { toast("Enter a name with at least one letter"); return; }
  const ex = entries[slugify(name)];
  me = ex ? JSON.parse(JSON.stringify(ex)) : blank(name);
  me.picks = me.picks||{}; me.bracket = me.bracket || blank("").bracket;
  dirty = false; store("pp27-draft", me);
  if (ex) toast("Loaded your saved picks");
  renderAllViews(); window.scrollTo(0,0);
}
async function saveMine(){
  if (!me.name) return;
  const btn = document.getElementById("savebtn"); btn.disabled = true; btn.textContent = "Saving…";
  const firstSave = !entries[slugify(me.name)];
  try{
    const doc = JSON.parse(JSON.stringify(me)); doc.updatedAt = Date.now();
    await api.saveEntry(slugify(me.name), doc);
    me.updatedAt = doc.updatedAt; entries[slugify(me.name)] = doc; dirty = false; store("pp27-draft", me);
    if (!me.wins) {
      toast(firstSave ? "Saved! Want to do the bonus round? It's right below." : "Picks saved");
      renderAllViews();
      if (firstSave) setTimeout(()=>{ const b = document.getElementById("bonus"); if (b) b.scrollIntoView({block:"start"}); }, 50);
    } else { toast("Picks saved"); const y = window.scrollY; renderAllViews(); window.scrollTo(0,y); }
  }catch(e){
    if (e && (e.code==="42501" || e.status===401 || e.status===403)) toast(locked() ? "Picks are locked" : "Couldn't save. Ask the commissioner to check the setup.");
    else toast("Couldn't save. Check your connection and try again.");
  }
  btn.textContent = "Save picks"; renderSaveBar();
}
async function saveResults(){
  const R = {awards:{}, wins:{}};
  AWARDS.forEach(a=>{ const v=document.getElementById("ra-"+a.k).value.trim(); if(v) R.awards[a.k]=v; });
  for (const k of ["champ","runnerup","fired"]) { const v=document.getElementById("rr-"+k).value; if(v) R[k]=v; }
  const hp = document.getElementById("rr-hiPlayer").value.trim(); if (hp) R.hiPlayer = hp;
  const pts = document.getElementById("rr-hiPts").value; if (pts) R.hiPts = Number(pts);
  for (const key of ["r1","r2","cf"]) R[key] = [...document.querySelectorAll(`[data-rr="${key}"]:checked`)].map(x=>x.value);
  ABBRS.forEach(a=>{ const v=document.getElementById("rw-"+a).value; if(v!=="") R.wins[a]=Math.max(0,Math.min(82,Number(v))); });
  R.updatedAt = Date.now();
  try{ await api.saveResults(R); results = R; toast("Results saved"); renderAllViews(); }
  catch(e){ toast("Couldn't save results. Try again."); }
}

document.addEventListener("mousedown", ev=>{ if (ev.target.closest(".sugg")) ev.preventDefault(); });
document.addEventListener("click", async ev=>{
  const t = ev.target.closest("button"); if(!t) return;
  if (t.dataset.fill != null){
    const inp = t.closest(".combo").querySelector("input");
    inp.value = t.dataset.fill; hideSugg();
    if (inp.dataset.pick){ me.picks[inp.dataset.pick] = inp.value; markDirty(); }
    inp.blur(); return;
  }
  if (t.dataset.tab){ tab = t.dataset.tab; store("pp27-tab", tab); renderAllViews(); window.scrollTo(0,0); return; }
  if (t.id==="savebtn") return saveMine();
  if (t.dataset.sheet) return openSheet(t.dataset.sheet);
  if (t.dataset.del){
    if (!t.dataset.confirm){ t.dataset.confirm="1"; t.textContent="Tap again to delete for good"; return; }
    try{ await api.deleteEntry(t.dataset.del); delete entries[t.dataset.del]; closeModal(); renderAllViews(); toast("Entry deleted"); }catch(e){ toast("Couldn't delete. Try again."); }
    return;
  }
  if (t.dataset.w){ const [a,d] = t.dataset.w.split("|"); wDraft[a] = Math.max(0, Math.min(82, wDraft[a]+Number(d))); document.getElementById("w-"+a).value = wDraft[a]; updOU(a); updTot(); return; }
  if (t.dataset.br){
    const [c,key,idx,a] = t.dataset.br.split("|");
    if (key==="finals") me.bracket.finals = me.bracket.finals===a?null:a;
    else if (key==="r1"||key==="r2") { const arr = me.bracket[c][key]; arr[+idx] = arr[+idx]===a?null:a; }
    else me.bracket[c][key] = me.bracket[c][key]===a?null:a;
    sanitize(me); markDirty(); const y = window.scrollY; renderPicks(); window.scrollTo(0,y); return;
  }
  switch (t.dataset.act){
    case "setname": return setName();
    case "switch":
      if (dirty && !t.dataset.confirm){ t.dataset.confirm="1"; t.textContent="Unsaved changes. Tap again"; return; }
      me = blank(""); dirty=false; store("pp27-draft", null); return renderAllViews();
    case "openwins": return openWins();
    case "wreset": ABBRS.forEach(a=>{ wDraft[a]=Math.ceil(TEAM[a].ou); document.getElementById("w-"+a).value=wDraft[a]; updOU(a); }); return updTot();
    case "wcancel": case "close": return closeModal();
    case "wdone": {
      me.wins = Object.assign({}, wDraft); sanitize(me); markDirty(); closeModal(); renderAllViews();
      setTimeout(()=>{ const b = document.getElementById("bonus"); if (b) b.scrollIntoView({block:"start"}); }, 50);
      toast("Standings set. Now pick your bracket, then Save."); return;
    }
    case "saveresults": return saveResults();
    case "adminlogin": {
      const k = document.getElementById("adminkey").value;
      try{ const ok = await rpc("admin_check", {p_key:k}); if (ok===true){ adminKey = k; store("pp27-admin", k); isAdmin = true; toast("Commissioner mode on"); renderAllViews(); } else toast("Wrong password"); }
      catch(e){ toast("Couldn't check the password. Try again."); }
      return;
    }
    case "adminlogout": adminKey = null; isAdmin = false; store("pp27-admin", null); return renderAllViews();
  }
});
document.addEventListener("focusin", ev=>{ const el = ev.target; if (el.matches && el.matches(".combo input")) showSugg(el); });
document.addEventListener("focusout", ev=>{ if (ev.target.matches && ev.target.matches(".combo input")) setTimeout(()=>{ if (!document.activeElement || !document.activeElement.closest || !document.activeElement.closest(".combo")) hideSugg(); }, 150); });
document.addEventListener("input", ev=>{
  const el = ev.target;
  if (el.dataset.win){ const a = el.dataset.win; let n = parseInt(el.value,10); if (isNaN(n)) return; n = Math.max(0,Math.min(82,n)); wDraft[a]=n; updOU(a); updTot(); return; }
  if (el.matches(".combo input")) showSugg(el);
  if (el.dataset.pick && el.tagName==="INPUT"){ me.picks[el.dataset.pick] = el.value.trim(); markDirty(); }
});
document.addEventListener("change", ev=>{
  const el = ev.target;
  if (el.dataset.win){ el.value = wDraft[el.dataset.win]; return; }
  if (el.dataset.pick && el.tagName==="SELECT"){
    me.picks[el.dataset.pick] = el.value; markDirty();
    if ((el.dataset.pick==="champ"||el.dataset.pick==="runnerup") && me.bracket && me.bracket.finals){ me.bracket.finals = null; toast("Your bracket's Finals pick was cleared to match"); const y=window.scrollY; renderPicks(); window.scrollTo(0,y); }
  }
  if (el.id==="allcat"){ allCat = el.value; renderAll(); }
});
document.addEventListener("keydown", ev=>{
  if (ev.key==="Enter" && ev.target.id==="nameinput") setName();
  if (ev.key==="Enter" && ev.target.id==="adminkey") document.querySelector('[data-act="adminlogin"]').click();
  if (ev.key==="Escape") { if (document.querySelector(".sugg:not([hidden])")) hideSugg(); else if (document.querySelector(".modal")) closeModal(); }
});

renderAllViews();
let wasLocked = locked();
setInterval(()=>{ renderLock(); if (locked()!==wasLocked){ wasLocked = locked(); if (!document.querySelector(".modal")) renderAllViews(); } }, 30000);

// ===================== connect =====================
async function refresh(){
  try{ await api.loadAll(); loadErr = false; } catch(e){ loadErr = true; }
  softRefresh();
}
(async ()=>{
  if (mode==="web"){
    if (adminKey){ try{ isAdmin = (await rpc("admin_check", {p_key:adminKey}))===true; }catch(e){} if (!isAdmin) { adminKey=null; store("pp27-admin", null); } }
    try{ await api.loadAll(); }catch(e){ loadErr = true; }
    renderAllViews();
    setInterval(()=>{ if (document.visibilityState==="visible") refresh(); }, 8000);
    document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") refresh(); });
    return;
  }
  // Preview inside Claude: use the artifact's shared store.
  if (!window.claude || !window.claude.use) return;
  const [d,u] = await Promise.all([claude.use("db").catch(()=>null), claude.use("user").catch(()=>null)]);
  if (!d) return;
  cdb = d; mode = "claude";
  if (u){ try{ isOwner = !!(await u.isOwner()); }catch(e){} }
  isAdmin = isOwner;
  cdb.collection("entries").onSnapshot(snap=>{ const next = {}; snap.docs.forEach(x=>{ const v=x.data(); if (v && v.name) next[x.id]=v; }); entries = next; softRefresh(); }, ()=>{});
  cdb.doc("meta/results").onSnapshot(s=>{ results = s.exists ? s.data() : null; softRefresh(); }, ()=>{});
  renderAllViews();
})();
})();
</script>
